<!--
  Modul: Aktier
  --------------
  Visar en TradingView "symbol overview"-widget för valda aktier, samt äger
  logiken för att lägga till/ta bort aktier i inställningsmodalen.

  Beroenden från huvudskalet (dashboard.html) — måste finnas laddade FÖRE denna modul:
    - cfg   (globalt state-objekt, cfg.stocks är listan över valda symboler)

  OBS: element som #stocksList, #inAddStock och #btnAddStock ligger fysiskt i
  huvudskalets inställningsmodal (inte i denna moduls egen platsdel), men det
  spelar ingen roll — DOM:en är sidövergripande, så den här modulen kan ändå
  hantera dem via document.getElementById() som vanligt.

  Publikt gränssnitt mot skalet:
    - renderStocksWidget(), pendingStocks och renderStocksList() nås som vanliga
      globala funktioner/variabler av openSettings()/saveSettings() i skalet,
      precis som innan uppdelningen (fungerar tack vare delat skript-scope).
-->
<div class="stocks" id="stocksWrap">
  <div class="tradingview-widget-container" id="stocksContainer">
    <div class="tradingview-widget-container__widget"></div>
  </div>
</div>

<style>
  .stocks{border-top:1px solid var(--border);margin-top:12px;padding-top:12px}
  .stock-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px}
  .stock-row .rm{color:var(--bad);cursor:pointer;font-size:14px;line-height:1;padding:0 4px}
</style>

<script src="scripts/aktier.js"></script>
