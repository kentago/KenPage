<!--
  Modul: Väder + Work info
  -------------------------
  Väder: 3-dagarsprognos (idag, imorgon, övermorgon) för vald "från"-station,
  med fallback till Kungsbacka om ingen matchning hittas.

  Work info: kollar om det väntas regn på samma ort under pendlingsfönstret
  07–18, och visar paraply- eller en glad emoji beroende på utfallet. Följer
  alltså samma ort som väderprognosen ovan — slås ihop till en fil eftersom
  de logiskt hör ihop och delar samma platslogik.

  Beroenden från huvudskalet (dashboard.html) — måste finnas laddade FÖRE denna modul:
    - stations                (globalt state-objekt)
    - COORDS                  (stad -> {lat,lon}-uppslag)
    - coordsForStationName()  (hjälpfunktion för att matcha stationsnamn mot COORDS)

  Publikt gränssnitt mot skalet:
    - Lyssnar på eventet "dashboard:refresh-weather" (uppdaterar BÅDA delarna)
    - Kör weather() och workInfo() själv vid laddning + var 30:e minut
-->
<div id="vaderWrap">
  <div class="weather-head"><span class="weather-title">☀️ Väder</span></div>
  <div class="weather" id="weather"></div>
  <div class="workinfo" id="workinfoWrap">
    <div class="workinfo-title">Work info</div>
    <div id="workinfoContent"><span class="empty">Hämtar...</span></div>
  </div>
</div>

<style>
  #vaderWrap{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:12px;position:relative}
  .weather-head{margin-bottom:8px}
  .weather-title{font:600 11px/1 'Oswald',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--ice)}
  .weather{display:flex;gap:20px;padding:4px 0}
  .weather-day{flex:1}
  .weather-lbl{font:600 11px/1 'Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--ice);margin-bottom:4px}
  .weather-ico{font-size:24px;line-height:1}
  .weather-tmp{font:600 20px/1 'Oswald',sans-serif;color:var(--text);margin-top:3px}
  .weather-tmp .lo{color:var(--muted);font-size:14px;margin-left:3px}
  .weather-dsc{font-size:11px;color:var(--muted);margin-top:2px}

  .workinfo{border-top:1px solid var(--border);margin-top:12px;padding-top:12px}
  .workinfo-title{font:600 11px/1 'Oswald',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--ice);margin-bottom:10px}
  .workinfo-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
  .workinfo-icon{font-size:26px;line-height:1}
  .workinfo-text{font-size:13px;color:var(--text)}
  .workinfo-sub{font-size:11px;color:var(--muted);margin-top:2px}
</style>

<script src="scripts/vader.js"></script>
