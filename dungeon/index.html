<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Infinite Dungeon</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><h1>⚔️ Infinite Dungeon</h1><button onclick="newRun()">🔄 New Run</button></header>
<p id="intro"></p>
<div class="nickname-row"><label>🏷️ Tag: </label><input id="nicknameInput" type="text" placeholder="Secret Hero" maxlength="20" onchange="setNickname(this.value)"><label class="country-opt"><input id="showCountry" type="checkbox" onchange="toggleCountry(this.checked)"> Show my flag</label></div>
<div id="stats" class="stats"></div>
<section><h2 id="roomTitle"></h2><p id="roomText"></p><div id="map"></div><div id="actions"></div></section>
<section><h2>📜 Activity Log</h2><div id="log"></div></section>
<section><h2>⚔️ Equipment</h2><div id="equipment" class="grid"></div></section>
<section><h2>🔎 Quest Search</h2><div id="quests"></div></section>
<section><h2>🎒 Extra Inventory</h2><div id="inventory" class="grid"></div></section>
<section><h2>🏆 Hall of Fame</h2><div id="hall"></div></section>
</main><script src="game.js"></script></body></html>
